name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleRelease --no-daemon --console=plain --stacktrace 2>&1 | tee build.log

      # The build log is saved to the ci-logs branch so it can be read through the repository API.
      - name: Save build log
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f build.log ] || echo "no build log" > build.log
          { echo "run ${{ github.run_number }} commit ${{ github.sha }} status ${{ job.status }}"; grep -E "^e: |^w: .*(deprecated|unused)|error:|What went wrong|BUILD (SUCCESSFUL|FAILED)" -A3 build.log | head -200; echo "----- tail -----"; tail -c 200000 build.log; } > log.txt
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/heads/ci-logs -f sha="$GITHUB_SHA" >/dev/null 2>&1 || true
          OLD=$(gh api "repos/$GITHUB_REPOSITORY/contents/build-log.txt?ref=ci-logs" --jq .sha 2>/dev/null || true)
          base64 -w0 log.txt > log.b64
          if [ -n "$OLD" ]; then
            jq -n --rawfile c log.b64 --arg sha "$OLD" '{message:"build log ${{ github.run_number }}",branch:"ci-logs",content:$c,sha:$sha}' > body.json
          else
            jq -n --rawfile c log.b64 '{message:"build log ${{ github.run_number }}",branch:"ci-logs",content:$c}' > body.json
          fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/build-log.txt" --input body.json >/dev/null

      - name: Name the APK
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VN=$VN" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Tomatime-$VN-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tomatime-apk
          path: Tomatime-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VN-build${{ github.run_number }}" Tomatime-*.apk \
            --title "Tomatime $VN (build ${{ github.run_number }})" \
            --notes "自動建置：${{ github.event.head_commit.message }}"

  # Installs the APK on an emulator, taps through the main flows and saves screenshots to the ci-logs branch.
  uitest:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: tomatime-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -timezone Asia/Taipei
          disable-animations: true
          script: python3 ci/ui_test.py "$(ls apk/*.apk | head -1)" shots

      - name: Save screenshots
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -d shots ] || exit 0
          put() {
            local file="$1" path="$2"
            local old
            old=$(gh api "repos/$GITHUB_REPOSITORY/contents/$path?ref=ci-logs" --jq .sha 2>/dev/null || true)
            base64 -w0 "$file" > /tmp/c.b64
            if [ -n "$old" ]; then
              jq -n --rawfile c /tmp/c.b64 --arg sha "$old" --arg m "ui $path" '{message:$m,branch:"ci-logs",content:$c,sha:$sha}' > /tmp/body.json
            else
              jq -n --rawfile c /tmp/c.b64 --arg m "ui $path" '{message:$m,branch:"ci-logs",content:$c}' > /tmp/body.json
            fi
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$path" --input /tmp/body.json >/dev/null || echo "upload failed: $path"
          }
          for f in shots/*; do put "$f" "shots/$(basename "$f")"; done
