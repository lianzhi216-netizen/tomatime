name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "VN=$VN" >> "$GITHUB_ENV"
          cp app/build/outputs/apk/release/app-release.apk "Tomatime-$VN-build${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tomatime-apk
          path: Tomatime-*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VN-build${{ github.run_number }}" Tomatime-*.apk \
            --title "Tomatime $VN (build ${{ github.run_number }})" \
            --notes "自動建置：${{ github.event.head_commit.message }}"
